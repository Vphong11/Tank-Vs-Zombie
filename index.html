<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Tank vs Zombies - Secured Admin Fixed</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            margin: 0;
            background-color: #0a0a0f;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            display: block;
            background-color: #14141c;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="900" height="650"></canvas>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resizeGame() {
        let windowWidth = window.innerWidth;
        let windowHeight = window.innerHeight;
        let gameWidth = 900;
        let gameHeight = 650;
        let scale = Math.min(windowWidth / gameWidth, windowHeight / gameHeight);
        
        canvas.style.width = (gameWidth * scale) + "px";
        canvas.style.height = (gameHeight * scale) + "px";
    }

    window.addEventListener('resize', resizeGame);
    window.addEventListener('orientationchange', resizeGame);
    setTimeout(resizeGame, 50);

    const ADMIN_SECRET_PASSWORD = "admin123";

    let playerGold = 500;
    let shopUpgrades = {
        "maxhp": 0, "dmg": 0, "spd": 0,
        "multishot": 0, "pierce": 0, "rate": 0,
        "vampire": 0, "explosive": 0, "nova": 0
    };

    const maxUpgradeLevels = {
        "maxhp": 5, "dmg": 3, "spd": 5,
        "multishot": 2, "pierce": 4, "rate": 4,
        "vampire": 2, "explosive": 1, "nova": 3
    };

    // Load dữ liệu an toàn
    if (localStorage.getItem('tank_gold') !== null) {
        playerGold = parseInt(localStorage.getItem('tank_gold')) || 500;
    }
    if (localStorage.getItem('tank_upgrades') !== null) {
        try {
            let saved = JSON.parse(localStorage.getItem('tank_upgrades'));
            for (let k in maxUpgradeLevels) {
                if (saved[k] !== undefined) {
                    shopUpgrades[k] = Math.min(saved[k], maxUpgradeLevels[k]);
                }
            }
        } catch(e) {}
    }

    function saveGame() {
        localStorage.setItem('tank_gold', playerGold);
        localStorage.setItem('tank_upgrades', JSON.stringify(shopUpgrades));
    }

    function clearAllData() {
        localStorage.removeItem('tank_gold');
        localStorage.removeItem('tank_upgrades');
        playerGold = 500;
        shopUpgrades = {
            "maxhp": 0, "dmg": 0, "spd": 0,
            "multishot": 0, "pierce": 0, "rate": 0,
            "vampire": 0, "explosive": 0, "nova": 0
        };
        player.reset();
    }

    const WIDTH = 900, HEIGHT = 650;
    let currentWave = 1;
    let zombiesToSpawn = 10;
    let zombiesSpawnedCount = 0;
    let spawnTimer = 0;
    let bossSpawnedInWave = false;
    let gameState = "MENU"; 
    let currentChoices = [];

    const btnDpadUp = { x: 100, y: HEIGHT - 140, r: 42, active: false };
    const btnDpadDown = { x: 100, y: HEIGHT - 50, r: 42, active: false };
    const btnDpadLeft = { x: 45, y: HEIGHT - 95, r: 42, active: false };
    const btnDpadRight = { x: 155, y: HEIGHT - 95, r: 42, active: false };
    const btnFire = { x: WIDTH - 100, y: HEIGHT - 95, r: 52, active: false };

    let bgDecorations = [];
    for (let i = 0; i < 35; i++) {
        bgDecorations.push({
            type: ["crater", "rock", "crack", "oil_pool"][Math.floor(Math.random() * 4)],
            x: Math.random() * (WIDTH - 100) + 50,
            y: Math.random() * (HEIGHT - 100) + 50,
            size: Math.floor(Math.random() * 35) + 20
        });
    }

    function getCanvasMousePos(e) {
        let rect = canvas.getBoundingClientRect();
        let scaleX = canvas.width / rect.width;
        let scaleY = canvas.height / rect.height;
        return {
            x: (e.clientX - rect.left) * scaleX,
            y: (e.clientY - rect.top) * scaleY
        };
    }

    function drawCoinIcon(x, y, radius = 10) {
        ctx.fillStyle = "rgb(180, 120, 10)";
        ctx.beginPath(); ctx.arc(x + 1, y + 2, radius, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgb(255, 210, 60)";
        ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgb(255, 230, 60)";
        ctx.beginPath(); ctx.arc(x, y, radius - 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "white";
        ctx.beginPath(); ctx.arc(x - 3, y - 3, 2, 0, Math.PI * 2); ctx.fill();
    }

    function drawSuperPolishedIcon(x, y, skillId, isHovered) {
        let size = 42;
        let offset = isHovered ? -2 : 0;
        let nx = x + offset, ny = y + offset;

        if (isHovered) {
            ctx.fillStyle = "rgba(255, 215, 0, 0.4)";
            ctx.beginPath(); ctx.roundRect(nx - 8, ny - 8, size + 16, size + 16, 12); ctx.fill();
        }

        ctx.fillStyle = "rgb(8, 8, 12)";
        ctx.beginPath(); ctx.roundRect(nx + 2, ny + 4, size, size, 10); ctx.fill();
        ctx.fillStyle = isHovered ? "rgb(48, 52, 75)" : "rgb(28, 30, 42)";
        ctx.beginPath(); ctx.roundRect(nx, ny, size, size, 10); ctx.fill();
        ctx.strokeStyle = isHovered ? "rgb(255, 210, 60)" : "rgb(110, 115, 140)";
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.roundRect(nx, ny, size, size, 10); ctx.stroke();

        let cx = nx + size / 2, cy = ny + size / 2;

        if (skillId === "maxhp") {
            ctx.fillStyle = "rgb(30, 100, 200)";
            ctx.beginPath(); ctx.moveTo(cx, cy - 14); ctx.lineTo(cx + 12, cy - 8); ctx.lineTo(cx + 10, cy + 6); ctx.lineTo(cx, cy + 14); ctx.lineTo(cx - 10, cy + 6); ctx.lineTo(cx - 12, cy - 8); ctx.fill();
            ctx.fillStyle = "rgb(80, 170, 255)";
            ctx.beginPath(); ctx.moveTo(cx, cy - 12); ctx.lineTo(cx + 10, cy - 7); ctx.lineTo(cx + 8, cy + 5); ctx.lineTo(cx, cy + 12); ctx.lineTo(cx - 8, cy + 5); ctx.lineTo(cx - 10, cy - 7); ctx.fill();
            ctx.fillStyle = "rgb(255, 60, 60)";
            ctx.beginPath(); ctx.arc(cx - 3, cy - 2, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 3, cy - 2, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cx - 6, cy - 1); ctx.lineTo(cx + 6, cy - 1); ctx.lineTo(cx, cy + 6); ctx.fill();
        } else if (skillId === "dmg") {
            ctx.strokeStyle = "white"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(cx - 11, cy + 11); ctx.lineTo(cx + 11, cy - 11); ctx.stroke();
            ctx.strokeStyle = "rgb(0, 245, 245)"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(cx - 10, cy + 10); ctx.lineTo(cx + 10, cy - 10); ctx.stroke();
            ctx.fillStyle = "rgb(255, 60, 60)";
            ctx.beginPath(); ctx.moveTo(cx + 11, cy - 11); ctx.lineTo(cx + 7, cy - 12); ctx.lineTo(cx + 12, cy - 7); ctx.fill();
            ctx.fillStyle = "rgb(255, 210, 60)"; ctx.fillRect(cx - 11, cy + 7, 5, 5);
        } else if (skillId === "spd") {
            ctx.fillStyle = "rgb(180, 180, 200)";
            ctx.beginPath(); ctx.moveTo(cx - 8, cy - 10); ctx.lineTo(cx + 10, cy - 4); ctx.lineTo(cx + 10, cy + 4); ctx.lineTo(cx - 8, cy + 10); ctx.fill();
            ctx.fillStyle = "rgb(0, 245, 245)";
            ctx.beginPath(); ctx.moveTo(cx + 10, cy - 5); ctx.lineTo(cx + 16, cy); ctx.lineTo(cx + 10, cy + 5); ctx.fill();
            ctx.fillStyle = "rgb(255, 130, 20)";
            ctx.beginPath(); ctx.moveTo(cx - 8, cy - 6); ctx.lineTo(cx - 15, cy); ctx.lineTo(cx - 8, cy + 6); ctx.fill();
        } else if (skillId === "multishot") {
            [-20, 0, 20].forEach(angle => {
                let rad = angle * Math.PI / 180;
                let ex = cx + Math.cos(rad) * 12, ey = cy + Math.sin(rad) * 12;
                ctx.strokeStyle = "rgb(55, 55, 70)"; ctx.lineWidth = 4;
                ctx.beginPath(); ctx.moveTo(cx - 6, cy); ctx.lineTo(ex, ey); ctx.stroke();
                ctx.fillStyle = "rgb(255, 230, 60)";
                ctx.beginPath(); ctx.arc(ex + Math.cos(rad)*4, ey + Math.sin(rad)*4, 3, 0, Math.PI*2); ctx.fill();
            });
        } else if (skillId === "pierce") {
            ctx.fillStyle = "rgb(180, 180, 190)"; ctx.fillRect(cx - 12, cy - 4, 16, 8);
            ctx.fillStyle = "rgb(255, 60, 60)";
            ctx.beginPath(); ctx.moveTo(cx + 4, cy - 6); ctx.lineTo(cx + 14, cy); ctx.lineTo(cx + 4, cy + 6); ctx.fill();
            ctx.strokeStyle = "rgb(0, 245, 245)"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(cx - 14, cy); ctx.lineTo(cx - 10, cy); ctx.stroke();
        } else if (skillId === "rate") {
            ctx.strokeStyle = "rgb(40, 180, 100)"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI*2); ctx.stroke();
            ctx.strokeStyle = "white"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 6, cy - 6); ctx.stroke();
        } else if (skillId === "vampire") {
            ctx.fillStyle = "rgb(120, 10, 10)";
            ctx.beginPath(); ctx.arc(cx, cy + 2, 8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cx - 8, cy + 2); ctx.lineTo(cx + 8, cy + 2); ctx.lineTo(cx, cy - 10); ctx.fill();
            ctx.fillStyle = "rgb(255, 60, 60)";
            ctx.beginPath(); ctx.arc(cx, cy + 2, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.moveTo(cx - 6, cy + 2); ctx.lineTo(cx + 6, cy + 2); ctx.lineTo(cx, cy - 8); ctx.fill();
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(cx - 2, cy - 1, 2, 0, Math.PI*2); ctx.fill();
        } else if (skillId === "explosive") {
            ctx.fillStyle = "rgb(20, 20, 20)"; ctx.beginPath(); ctx.arc(cx - 2, cy + 2, 9, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = "rgb(60, 60, 65)"; ctx.beginPath(); ctx.arc(cx - 2, cy + 2, 7, 0, Math.PI*2); ctx.fill();
            ctx.strokeStyle = "rgb(255, 210, 60)"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(cx, cy - 5); ctx.lineTo(cx + 6, cy - 11); ctx.stroke();
            ctx.fillStyle = "rgb(255, 60, 60)"; ctx.beginPath(); ctx.arc(cx + 7, cy - 12, 3, 0, Math.PI*2); ctx.fill();
        } else if (skillId === "nova") {
            ctx.strokeStyle = "rgb(190, 90, 255)"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(cx, cy, 12, 0, Math.PI*2); ctx.stroke();
            ctx.strokeStyle = "rgb(0, 245, 245)";
            ctx.beginPath(); ctx.arc(cx, cy, 7, 0, Math.PI*2); ctx.stroke();
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI*2); ctx.fill();
        }
    }

    class TankPlayer {
        constructor() {
            this.maxHp = 120;
            this.hp = 120;
            this.reset();
        }

        recalculateStats() {
            this.speed = 3.5 + ((shopUpgrades["spd"] || 0) * 0.4);
            let prevMax = this.maxHp;
            this.maxHp = 120 + ((shopUpgrades["maxhp"] || 0) * 30);
            this.hp += (this.maxHp - prevMax);
            this.damage = 30 + ((shopUpgrades["dmg"] || 0) * 10);
            this.fireRate = Math.max(60, 300 - ((shopUpgrades["rate"] || 0) * 30));
        }

        reset() {
            this.x = WIDTH / 2;
            this.y = HEIGHT / 2;
            this.level = 1;
            this.exp = 0;
            this.expToNextLevel = 100;
            this.lastShot = 0;
            this.bulletCount = 1 + (shopUpgrades["multishot"] || 0);
            this.pierceCount = 1 + (shopUpgrades["pierce"] || 0);
            this.explosiveBullets = (shopUpgrades["explosive"] || 0) > 0;
            this.vampirism = (shopUpgrades["vampire"] || 0) * 2;
            this.recalculateStats();
            this.hp = this.maxHp;
        }

        draw() {
            let px = Math.floor(this.x), py = Math.floor(this.y);
            let gunAngle = Math.atan2(mouse.y - py, mouse.x - px);

            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.beginPath(); ctx.ellipse(px, py, 30, 25, 0, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "rgb(20, 20, 25)";
            ctx.fillRect(px - 24, py - 20, 10, 40);
            ctx.fillRect(px + 14, py - 20, 10, 40);
            ctx.fillStyle = "rgb(40, 110, 60)";
            ctx.fillRect(px - 20, py - 16, 40, 32);

            let ex = px + Math.cos(gunAngle) * 32;
            let ey = py + Math.sin(gunAngle) * 32;
            ctx.strokeStyle = "rgb(30, 30, 35)";
            ctx.lineWidth = 8;
            ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(ex, ey); ctx.stroke();
            
            ctx.fillStyle = "rgb(0, 245, 245)";
            ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "rgb(15, 15, 20)";
            ctx.fillRect(this.x - 24, this.y - 55, 48, 8);
            let hpWidth = Math.max(0, 44 * (this.hp / this.maxHp));
            ctx.fillStyle = "rgb(45, 240, 120)";
            ctx.fillRect(this.x - 22, this.y - 53, hpWidth, 4);
        }

        move(keys) {
            let dx = 0, dy = 0;
            if ((keys['w'] || btnDpadUp.active) && this.y > 30) dy -= 1;
            if ((keys['s'] || btnDpadDown.active) && this.y < HEIGHT - 30) dy += 1;
            if ((keys['a'] || btnDpadLeft.active) && this.x > 30) dx -= 1;
            if ((keys['d'] || btnDpadRight.active) && this.x < WIDTH - 30) dx += 1;

            if (dx !== 0 || dy !== 0) {
                let len = Math.hypot(dx, dy);
                this.x += (dx / len) * this.speed;
                this.y += (dy / len) * this.speed;
            }
        }

        addExp(amount) {
            this.exp += amount;
            let leveledUp = false;
            while (this.exp >= this.expToNextLevel) {
                this.exp -= this.expToNextLevel;
                this.level += 1;
                this.expToNextLevel = this.level * 100;
                leveledUp = true;
            }
            return leveledUp;
        }
    }

    class Bullet {
        constructor(x, y, angleRad, damage, pierce, isExplosive) {
            this.x = x; this.y = y;
            this.damage = damage;
            this.speed = 13;
            this.dx = Math.cos(angleRad) * this.speed;
            this.dy = Math.sin(angleRad) * this.speed;
            this.pierce = pierce;
            this.isExplosive = isExplosive;
        }
        update() { this.x += this.dx; this.y += this.dy; }
        draw() {
            ctx.fillStyle = this.isExplosive ? "rgb(255, 130, 20)" : "rgb(255, 230, 60)";
            ctx.beginPath(); ctx.arc(this.x, this.y, 5, 0, Math.PI * 2); ctx.fill();
        }
    }

    class Zombie {
        constructor(isBoss = false, wave = 1) {
            let side = ['top', 'bottom', 'left', 'right'][Math.floor(Math.random() * 4)];
            if (side === 'top') { this.x = Math.random() * WIDTH; this.y = -45; }
            else if (side === 'bottom') { this.x = Math.random() * WIDTH; this.y = HEIGHT + 45; }
            else if (side === 'left') { this.x = -45; this.y = Math.random() * HEIGHT; }
            else { this.x = WIDTH + 45; this.y = Math.random() * HEIGHT; }

            this.isBoss = isBoss;
            let tier = Math.floor((wave - 1) / 10);
            let multiplier = 1 + (tier * 0.4);

            if (isBoss) {
                this.type = "TANK";
                this.radius = 28; this.speed = 1.25;
                this.hp = this.maxHp = (850 + (wave * 150)) * multiplier;
                this.damage = 1.2 * multiplier;
                this.skinColor = "rgb(40, 70, 50)";
                this.shirtColor = "rgb(30, 30, 30)";
                this.expReward = 1000; this.goldDrop = 150;
            } else {
                this.type = Math.random() < 0.5 ? "NORMAL" : "FAST";
                this.radius = this.type === "NORMAL" ? 16 : 13;
                this.speed = (Math.random() * 0.5 + 1.3) + (wave * 0.05);
                this.hp = this.maxHp = (50 + (wave - 1) * 20) * multiplier;
                this.damage = 0.5 * multiplier;
                this.skinColor = this.type === "NORMAL" ? "rgb(80, 130, 70)" : "rgb(130, 60, 50)";
                this.shirtColor = this.type === "NORMAL" ? "rgb(60, 60, 90)" : "rgb(100, 30, 30)";
                this.expReward = 15 + (wave * 2); this.goldDrop = 10 + wave;
            }
        }

        update(px, py) {
            let angle = Math.atan2(py - this.y, px - this.x);
            this.x += Math.cos(angle) * this.speed;
            this.y += Math.sin(angle) * this.speed;
        }

        draw(px, py) {
            let ix = Math.floor(this.x), iy = Math.floor(this.y);
            let angle = Math.atan2(py - iy, px - ix);
            let cosA = Math.cos(angle), sinA = Math.sin(angle);

            ctx.strokeStyle = this.shirtColor;
            ctx.lineWidth = this.radius * 0.8;
            let shoulderW = this.radius * 1.1;
            let p1x = ix + cosA * 2 - sinA * shoulderW, p1y = iy + sinA * 2 + cosA * shoulderW;
            let p2x = ix + cosA * 2 + sinA * shoulderW, p2y = iy + sinA * 2 - cosA * shoulderW;
            ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p2x, p2y); ctx.stroke();

            ctx.strokeStyle = this.skinColor;
            ctx.lineWidth = 4;
            let armLen = this.radius * 1.5;
            ctx.beginPath(); ctx.moveTo(p1x, p1y); ctx.lineTo(p1x + cosA * armLen, p1y + sinA * armLen); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(p2x, p2y); ctx.lineTo(p2x + cosA * armLen, p2y + sinA * armLen); ctx.stroke();

            let headX = ix + cosA * 4, headY = iy + sinA * 4;
            ctx.fillStyle = this.skinColor;
            ctx.beginPath(); ctx.arc(headX, headY, this.radius * 0.75, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "rgb(10, 10, 15)"; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(headX, headY, this.radius * 0.75, 0, Math.PI * 2); ctx.stroke();

            if (this.hp < this.maxHp) {
                let barW = this.radius * 2.2;
                ctx.fillStyle = "rgb(15, 15, 20)";
                ctx.fillRect(ix - barW / 2, iy - this.radius - 12, barW, 4);
                ctx.fillStyle = "rgb(45, 240, 120)";
                ctx.fillRect(ix - barW / 2, iy - this.radius - 12, Math.max(0, barW * (this.hp / this.maxHp)), 4);
            }
        }
    }

    class Explosion {
        constructor(x, y, radius) {
            this.x = x; this.y = y;
            this.maxRadius = radius;
            this.currentRadius = 6;
            this.alpha = 255;
        }
        update() {
            this.currentRadius += 5;
            this.alpha -= 18;
            return this.alpha <= 0 || this.currentRadius >= this.maxRadius;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.alpha / 255);
            ctx.fillStyle = "rgb(255, 140, 20)";
            ctx.beginPath(); ctx.arc(this.x, this.y, this.currentRadius, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "rgb(255, 240, 150)";
            ctx.beginPath(); ctx.arc(this.x, this.y, this.currentRadius * 0.4, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        }
    }

    class Coin {
        constructor(x, y, value) {
            this.x = x; this.y = y; this.value = value; this.radius = 8;
        }
        draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
            ctx.beginPath(); ctx.ellipse(this.x, this.y + 3, 9, 6, 0, 0, Math.PI * 2); ctx.fill();
            drawCoinIcon(this.x, this.y, this.radius);
        }
    }

    const UPGRADE_POOL = [
        {"id": "multishot", "text": "Pháo Đa Nòng (+1 Đạn)"},
        {"id": "pierce", "text": "Đạn Xuyên Thấu (+1 Quái)"},
        {"id": "explosive", "text": "Đạn Pháo Nổ Diện Rộng"},
        {"id": "vampire", "text": "Hút Máu Khi Diệt Quái"},
        {"id": "nova", "text": "Sóng Nổ Quét Bản Đồ"},
        {"id": "dmg", "text": "+10 Sát Thương Pháo"},
        {"id": "spd", "text": "+15% Tốc Độ Động Cơ"},
        {"id": "rate", "text": "+20% Tốc Độ Bắn"},
        {"id": "maxhp", "text": "+25% Máu Tối Đa"}
    ];

    let player = new TankPlayer();
    let bullets = [], zombies = [], explosions = [], coins = [];
    let keys = {};
    let mouse = { x: WIDTH / 2 + 100, y: HEIGHT / 2, pressed: false };

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
    
    canvas.addEventListener('mousemove', e => {
        let pos = getCanvasMousePos(e);
        mouse.x = pos.x;
        mouse.y = pos.y;
    });

    function checkButtonPress(mx, my, isDown) {
        if (Math.hypot(mx - btnDpadUp.x, my - btnDpadUp.y) <= btnDpadUp.r) btnDpadUp.active = isDown;
        if (Math.hypot(mx - btnDpadDown.x, my - btnDpadDown.y) <= btnDpadDown.r) btnDpadDown.active = isDown;
        if (Math.hypot(mx - btnDpadLeft.x, my - btnDpadLeft.y) <= btnDpadLeft.r) btnDpadLeft.active = isDown;
        if (Math.hypot(mx - btnDpadRight.x, my - btnDpadRight.y) <= btnDpadRight.r) btnDpadRight.active = isDown;
        if (Math.hypot(mx - btnFire.x, my - btnFire.y) <= btnFire.r) btnFire.active = isDown;
    }

    canvas.addEventListener('mousedown', e => {
        let pos = getCanvasMousePos(e);
        checkButtonPress(pos.x, pos.y, true);
        if (Math.hypot(pos.x - btnFire.x, pos.y - btnFire.y) > btnFire.r) mouse.pressed = true;
    });

    canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        for (let touch of e.changedTouches) {
            let pos = getCanvasMousePos(touch);
            checkButtonPress(pos.x, pos.y, true);
            if (Math.hypot(pos.x - btnFire.x, pos.y - btnFire.y) > btnFire.r) mouse.pressed = true;
        }
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        btnDpadUp.active = false; btnDpadDown.active = false;
        btnDpadLeft.active = false; btnDpadRight.active = false;
        btnFire.active = false; mouse.pressed = false;

        for (let touch of e.touches) {
            let pos = getCanvasMousePos(touch);
            checkButtonPress(pos.x, pos.y, true);
            if (Math.hypot(pos.x - btnFire.x, pos.y - btnFire.y) > btnFire.r) mouse.pressed = true;
        }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
        e.preventDefault();
        btnDpadUp.active = false; btnDpadDown.active = false;
        btnDpadLeft.active = false; btnDpadRight.active = false;
        btnFire.active = false; mouse.pressed = false;
    });

    window.addEventListener('mouseup', () => {
        btnDpadUp.active = false; btnDpadDown.active = false;
        btnDpadLeft.active = false; btnDpadRight.active = false;
        btnFire.active = false; mouse.pressed = false;
    });

    function getUpgradeCost(itemId, currentLevel) {
        if (itemId === "maxhp") return [50, 125, 300, 1000, 3000][currentLevel] || null;
        if (itemId === "dmg") return [300, 800, 1700][currentLevel] || null;
        if (itemId === "spd") return [100, 200, 300, 400, 500][currentLevel] || null;
        if (itemId === "multishot") return [5000, 12000][currentLevel] || null;
        if (itemId === "pierce") return [150, 500, 1000, 1900][currentLevel] || null;
        if (itemId === "rate") return [300, 1000, 2000, 3500][currentLevel] || null;
        if (itemId === "vampire") return [10000, 20000][currentLevel] || null;
        if (itemId === "explosive") return [5000][currentLevel] || null;
        if (itemId === "nova") return [5000, 10000, 15000][currentLevel] || null;
        return 0;
    }

    function handleScreenClick(clientX, clientY) {
        let rect = canvas.getBoundingClientRect();
        let scaleX = canvas.width / rect.width;
        let scaleY = canvas.height / rect.height;
        let mx = (clientX - rect.left) * scaleX;
        let my = (clientY - rect.top) * scaleY;

        if (gameState === "MENU") {
            if (mx >= WIDTH/2 - 140 && mx <= WIDTH/2 + 140 && my >= HEIGHT/2 - 10 && my <= HEIGHT/2 + 50) resetGame();
            else if (mx >= WIDTH/2 - 140 && mx <= WIDTH/2 + 140 && my >= HEIGHT/2 + 65 && my <= HEIGHT/2 + 120) gameState = "SHOP";
            else if (mx >= WIDTH/2 - 140 && mx <= WIDTH/2 + 140 && my >= HEIGHT/2 + 135 && my <= HEIGHT/2 + 185) {
                gameState = "ADMIN_LOGIN";
            }
        } else if (gameState === "ADMIN_LOGIN") {
            if (mx >= WIDTH/2 - 110 && mx <= WIDTH/2 + 110 && my >= 270 && my <= 320) {
                let enteredPass = prompt("Nhập mật khẩu quản trị (Mặc định: admin123):");
                if (enteredPass === ADMIN_SECRET_PASSWORD) {
                    gameState = "ADMIN";
                } else if (enteredPass !== null) {
                    alert("Sai mật khẩu! Bạn không có quyền truy cập.");
                }
            }
            else if (mx >= WIDTH/2 - 110 && mx <= WIDTH/2 + 110 && my >= HEIGHT - 65 && my <= HEIGHT - 20) {
                gameState = "MENU";
            }
        } else if (gameState === "ADMIN") {
            if (mx >= WIDTH/2 - 180 && mx <= WIDTH/2 + 180 && my >= 130 && my <= 180) {
                clearAllData();
                alert("Đã xóa sạch bộ nhớ và đưa cấp độ về 0 thành công!");
            }
            else if (mx >= WIDTH/2 - 180 && mx <= WIDTH/2 + 180 && my >= 195 && my <= 245) {
                playerGold += 50000;
                saveGame();
            }
            else if (mx >= WIDTH/2 - 180 && mx <= WIDTH/2 + 180 && my >= 260 && my <= 310) {
                for (let k in maxUpgradeLevels) {
                    shopUpgrades[k] = maxUpgradeLevels[k];
                }
                saveGame();
                player.reset();
            }
            else if (mx >= WIDTH/2 - 180 && mx <= WIDTH/2 + 180 && my >= 325 && my <= 375) {
                currentWave = 10;
                zombiesToSpawn = 100;
                zombiesSpawnedCount = 0;
                bossSpawnedInWave = false;
            }
            else if (mx >= WIDTH/2 - 180 && mx <= WIDTH/2 + 180 && my >= 390 && my <= 440) {
                player.hp = player.maxHp;
            }
            else if (mx >= WIDTH/2 - 110 && mx <= WIDTH/2 + 110 && my >= HEIGHT - 65 && my <= HEIGHT - 20) {
                gameState = "MENU";
            }
        } else if (gameState === "SHOP") {
            if (mx >= WIDTH/2 - 110 && mx <= WIDTH/2 + 110 && my >= HEIGHT - 55 && my <= HEIGHT - 15) {
                gameState = "MENU";
            }
            
            let colWidth = 420, rowHeight = 50;
            let startX1 = WIDTH/2 - 430, startX2 = WIDTH/2 + 10, startY = 90;

            let itemsList = [
                {id: "maxhp"}, {id: "dmg"}, {id: "spd"},
                {id: "multishot"}, {id: "pierce"}, {id: "rate"},
                {id: "vampire"}, {id: "explosive"}, {id: "nova"}
            ];

            itemsList.forEach((item, i) => {
                let c = i < 5 ? 0 : 1;
                let r = c === 0 ? i : i - 5;
                let bx = c === 0 ? startX1 : startX2;
                let by = startY + r * rowHeight;
                if (i === 8) { bx = WIDTH/2 - colWidth/2; by = startY + 5 * rowHeight; }

                if (mx >= bx && mx <= bx + colWidth && my >= by && my <= by + 44) {
                    let currentLvl = shopUpgrades[item.id] || 0;
                    let maxLvl = maxUpgradeLevels[item.id];
                    
                    if (currentLvl < maxLvl) {
                        let cost = getUpgradeCost(item.id, currentLvl);
                        if (cost !== null && playerGold >= cost) {
                            playerGold -= cost;
                            shopUpgrades[item.id] = currentLvl + 1;
                            player.reset();
                            saveGame();
                        }
                    }
                }
            });
        } else if (gameState === "LEVEL_UP") {
            currentChoices.forEach((choice, i) => {
                let bx = WIDTH/2 - 200, by = 180 + i * 85;
                if (mx >= bx && mx <= bx + 400 && my >= by && my <= by + 65) {
                    applyUpgrade(choice.id);
                    gameState = "PLAYING";
                }
            });
        } else if (gameState === "GAME_OVER") {
            if (mx >= WIDTH/2 - 110 && mx <= WIDTH/2 + 110 && my >= HEIGHT/2 + 10 && my <= HEIGHT/2 + 58) {
                resetGame();
            } else if (mx >= WIDTH/2 - 110 && mx <= WIDTH/2 + 110 && my >= HEIGHT/2 + 70 && my <= HEIGHT/2 + 118) {
                gameState = "MENU";
            }
        }
    }

    canvas.addEventListener('click', e => {
        handleScreenClick(e.clientX, e.clientY);
    });

    canvas.addEventListener('touchend', e => {
        if (e.changedTouches.length > 0) {
            let touch = e.changedTouches[0];
            handleScreenClick(touch.clientX, touch.clientY);
        }
    });

    function resetGame() {
        player.reset();
        bullets = []; zombies = []; explosions = []; coins = [];
        currentWave = 1; zombiesToSpawn = 10; zombiesSpawnedCount = 0; bossSpawnedInWave = false;
        gameState = "PLAYING";
    }

    function applyUpgrade(upgradeId) {
        if (upgradeId === "multishot") player.bulletCount = Math.min(5, player.bulletCount + 1);
        else if (upgradeId === "pierce") player.pierceCount += 1;
        else if (upgradeId === "explosive") player.explosiveBullets = true;
        else if (upgradeId === "vampire") player.vampirism += 2;
        else if (upgradeId === "nova") {
            explosions.push(new Explosion(player.x, player.y, 220));
            zombies.forEach(z => { if (Math.hypot(z.x - player.x, z.y - player.y) < 220) z.hp -= 70; });
        }
        else if (upgradeId === "dmg") player.damage += 10;
        else if (upgradeId === "spd") player.speed *= 1.15;
        else if (upgradeId === "rate") player.fireRate = Math.max(60, player.fireRate * 0.8);
        else if (upgradeId === "maxhp") { player.maxHp *= 1.25; player.hp += player.maxHp * 0.25; }
    }

    function drawOnScreenControls() {
        if (gameState !== "PLAYING" && gameState !== "LEVEL_UP") return;

        ctx.fillStyle = "rgba(40, 40, 55, 0.4)";
        ctx.beginPath(); ctx.arc(100, HEIGHT - 95, 85, 0, Math.PI * 2); ctx.fill();

        function drawPadBtn(btn, text) {
            ctx.fillStyle = btn.active ? "rgba(0, 245, 245, 0.7)" : "rgba(70, 70, 95, 0.6)";
            ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = "rgba(255, 255, 255, 0.5)"; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = "white"; ctx.font = "bold 20px Segoe UI"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
            ctx.fillText(text, btn.x, btn.y);
        }

        drawPadBtn(btnDpadUp, "▲");
        drawPadBtn(btnDpadDown, "▼");
        drawPadBtn(btnDpadLeft, "◄");
        drawPadBtn(btnDpadRight, "►");

        ctx.fillStyle = btnFire.active ? "rgba(255, 60, 60, 0.9)" : "rgba(180, 40, 40, 0.7)";
        ctx.beginPath(); ctx.arc(btnFire.x, btnFire.y, btnFire.r, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "rgba(255, 210, 60, 0.7)"; ctx.lineWidth = 3; ctx.stroke();
        ctx.fillStyle = "white"; ctx.font = "bold 18px Segoe UI"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("BẮN", btnFire.x, btnFire.y);
        ctx.textBaseline = "alphabetic"; 
    }

    function gameLoop() {
        let now = Date.now();

        if (gameState === "PLAYING") {
            player.move(keys);

            if ((mouse.pressed || btnFire.active) && now - player.lastShot > player.fireRate) {
                let baseAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
                let spread = 0.15, numB = player.bulletCount;
                let startAngle = baseAngle - (spread * (numB - 1) / 2);
                for (let i = 0; i < numB; i++) {
                    bullets.push(new Bullet(player.x, player.y, startAngle + (spread * i), player.damage, player.pierceCount, player.explosiveBullets));
                }
                player.lastShot = now;
            }

            if (zombiesSpawnedCount < zombiesToSpawn) {
                spawnTimer++;
                if (spawnTimer >= 30) {
                    zombies.push(new Zombie(false, currentWave));
                    zombiesSpawnedCount++;
                    spawnTimer = 0;
                }
            } else if (currentWave % 10 === 0 && !bossSpawnedInWave) {
                zombies.push(new Zombie(true, currentWave));
                bossSpawnedInWave = true;
            } else if (zombiesSpawnedCount >= zombiesToSpawn && zombies.length === 0) {
                currentWave++;
                zombiesToSpawn = currentWave * 10;
                zombiesSpawnedCount = 0;
                bossSpawnedInWave = false;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].update();
                if (bullets[i].x < 0 || bullets[i].x > WIDTH || bullets[i].y < 0 || bullets[i].y > HEIGHT) bullets.splice(i, 1);
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                if (explosions[i].update()) explosions.splice(i, 1);
            }

            for (let i = coins.length - 1; i >= 0; i--) {
                if (Math.hypot(coins[i].x - player.x, coins[i].y - player.y) < 25) {
                    playerGold += coins[i].value;
                    coins.splice(i, 1);
                    saveGame();
                }
            }

            for (let i = zombies.length - 1; i >= 0; i--) {
                let z = zombies[i];
                z.update(player.x, player.y);

                if (Math.hypot(z.x - player.x, z.y - player.y) < z.radius + 16) {
                    player.hp -= z.damage;
                    if (player.hp <= 0) gameState = "GAME_OVER";
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (Math.hypot(z.x - b.x, z.y - b.y) < z.radius + 4) {
                        z.hp -= b.damage;
                        if (b.isExplosive) {
                            explosions.push(new Explosion(b.x, b.y, 85));
                            zombies.forEach(zb => { if (Math.hypot(zb.x - b.x, zb.y - b.y) < 85) zb.hp -= b.damage * 0.5; });
                        }

                        b.pierce--;
                        if (b.pierce <= 0) bullets.splice(j, 1);

                        if (z.hp <= 0) {
                            coins.push(new Coin(z.x, z.y, z.goldDrop));
                            if (player.vampirism > 0) player.hp = Math.min(player.maxHp, player.hp + player.vampirism);
                            zombies.splice(i, 1);
                            if (player.addExp(z.expReward)) {
                                gameState = "LEVEL_UP";
                                currentChoices = [];
                                let poolCopy = [...UPGRADE_POOL];
                                for (let k = 0; k < 3; k++) {
                                    let idx = Math.floor(Math.random() * poolCopy.length);
                                    currentChoices.push(poolCopy.splice(idx, 1)[0]);
                                }
                            }
                            break;
                        }
                    }
                }
            }
        }

        ctx.fillStyle = "rgb(20, 20, 28)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        bgDecorations.forEach(deco => {
            if (deco.type === "crater") {
                ctx.fillStyle = "rgb(14, 14, 20)"; ctx.beginPath(); ctx.arc(deco.x, deco.y, deco.size, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = "rgb(28, 28, 38)"; ctx.lineWidth = 2; ctx.stroke();
            } else if (deco.type === "rock") {
                ctx.fillStyle = "rgb(32, 32, 44)"; ctx.beginPath(); ctx.ellipse(deco.x, deco.y, deco.size/2, deco.size/4, 0, 0, Math.PI*2); ctx.fill();
            }
        });

        if (gameState === "MENU") {
            ctx.fillStyle = "rgba(10, 10, 20, 0.75)"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = "rgb(45, 240, 120)"; ctx.font = "bold 52px Segoe UI"; ctx.textAlign = "center";
            ctx.fillText("TANK VS ZOMBIES", WIDTH/2, 140);

            drawCoinIcon(WIDTH - 75, 25, 12);
            ctx.fillStyle = "rgb(255, 210, 60)"; ctx.font = "bold 16px Segoe UI"; ctx.textAlign = "left";
            ctx.fillText(playerGold, WIDTH - 55, 31);

            ctx.fillStyle = "rgb(45, 240, 120)"; ctx.fillRect(WIDTH/2 - 140, HEIGHT/2 - 10, 280, 60);
            ctx.fillStyle = "rgb(10, 10, 15)"; ctx.font = "bold 20px Segoe UI"; ctx.textAlign = "center";
            ctx.fillText("🚀 BẮT ĐẦU CHƠI", WIDTH/2, HEIGHT/2 + 28);

            ctx.fillStyle = "rgb(255, 210, 60)"; ctx.fillRect(WIDTH/2 - 140, HEIGHT/2 + 65, 280, 55);
            ctx.fillStyle = "rgb(10, 10, 15)"; ctx.font = "bold 18px Segoe UI";
            ctx.fillText("🛒 CỬA HÀNG VẬT PHẨM", WIDTH/2, HEIGHT/2 + 99);

            ctx.fillStyle = "rgb(220, 60, 80)"; ctx.fillRect(WIDTH/2 - 140, HEIGHT/2 + 135, 280, 50);
            ctx.fillStyle = "white"; ctx.font = "bold 17px Segoe UI";
            ctx.fillText("⚙️ QUẢN TRỊ ADMIN", WIDTH/2, HEIGHT/2 + 166);

        } else if (gameState === "ADMIN_LOGIN") {
            ctx.fillStyle = "rgba(10, 10, 20, 0.95)"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = "rgb(255, 70, 70)"; ctx.font = "bold 32px Segoe UI"; ctx.textAlign = "center";

        } else if (gameState === "ADMIN") {

            let adminBtns = [
                { text: "♻️ XÓA TOÀN BỘ DỮ LIỆU NGƯỜI CHƠI", y: 130, color: "rgb(200, 40, 40)" },
                { text: "💰 THÊM +50,000 VÀNG", y: 195, color: "rgb(210, 160, 30)" },

            ];

            adminBtns.forEach(btn => {
                let isHover = mouse.x >= WIDTH/2 - 180 && mouse.x <= WIDTH/2 + 180 && mouse.y >= btn.y && mouse.y <= btn.y + 50;
                ctx.fillStyle = isHover ? "white" : btn.color;
                ctx.fillRect(WIDTH/2 - 180, btn.y, 360, 50);

            ctx.fillText("QUAY LẠI MENU", WIDTH/2, HEIGHT - 37);

        } else if (gameState === "SHOP") {
            ctx.fillStyle = "rgba(10, 10, 20, 0.92)"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = "rgb(255, 210, 60)"; ctx.font = "bold 30px Segoe UI"; ctx.textAlign = "center";
            ctx.fillText("🛒 CỬA HÀNG TRANG BỊ & NÂNG CẤP", WIDTH/2, 50);

            drawCoinIcon(WIDTH - 75, 25, 12);
            ctx.fillStyle = "rgb(255, 210, 60)"; ctx.font = "bold 16px Segoe UI"; ctx.textAlign = "left";
            ctx.fillText(playerGold, WIDTH - 55, 31);

            let shopItems = [
                {id: "maxhp", name: "Tăng Máu Tối Đa"},
                {id: "dmg", name: "Tăng Sát Thương"},
                {id: "spd", name: "Tốc Độ Di Chuyển"},
                {id: "multishot", name: "Pháo Đa Nòng"},
                {id: "pierce", name: "Đạn Xuyên Thấu"},
                {id: "rate", name: "Tốc Độ Bắn Nhanh"},
                {id: "vampire", name: "Trang Bị Hút Máu"},
                {id: "explosive", name: "Đạn Pháo Nổ"},
                {id: "nova", name: "Sóng Nổ Kích Hoạt"},
            ];

            let colWidth = 420, rowHeight = 50;
            let startX1 = WIDTH/2 - 430, startX2 = WIDTH/2 + 10, startY = 90;

            shopItems.forEach((item, i) => {

                let isHover = mouse.x >= bx && mouse.x <= bx + colWidth && mouse.y >= by && mouse.y <= by + 44;

                drawSuperPolishedIcon(bx + 8, by + 1, item.id, isHover);

            ctx.fillText(`Máu: ${Math.floor(player.hp)} / ${Math.floor(player.maxHp)}`, 20, 52);

            ctx.fillStyle = "rgb(0, 245, 245)"; ctx.textAlign = "center"; ctx.font = "bold 20px Segoe UI";
            ctx.fillText(`ĐỢT: ${currentWave}`, WIDTH/2, 28);
            let rem = (zombiesToSpawn - zombiesSpawnedCount) + zombies.length;
            ctx.fillStyle = "rgb(255, 60, 60)"; ctx.font = "bold 16px Segoe UI";
            ctx.fillText(`Còn lại: ${rem} con`, WIDTH/2, 50);

            drawCoinIcon(WIDTH - 75, 25, 12);
            ctx.fillStyle = "rgb(255, 210, 60)"; ctx.textAlign = "left";
            ctx.fillText(playerGold, WIDTH - 55, 31);

            let barW = WIDTH - 40, barH = 10, barX = 20, barY = HEIGHT - 20;

            let curXpW = Math.max(0, barW * (player.exp / player.expToNextLevel));
            ctx.fillStyle = "rgb(50, 180, 255)"; ctx.fillRect(barX, barY, curXpW, barH);
            ctx.strokeStyle = "rgb(80, 150, 220)"; ctx.strokeRect(barX, barY, barW, barH);

            ctx.fillStyle = "white"; ctx.font = "bold 14px Segoe UI"; ctx.textAlign = "center";
            ctx.fillText(`XP: ${Math.floor(player.exp)} / ${player.expToNextLevel}`, WIDTH/2, barY - 6);

            drawOnScreenControls();
        }

        if (gameState === "LEVEL_UP") {
            ctx.fillStyle = "rgba(5, 5, 12, 0.85)"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = "rgb(255, 210, 60)"; ctx.font = "bold 30px Segoe UI"; ctx.textAlign = "center";
            ctx.fillText("⚡ NÂNG CẤP KỸ NĂNG XE TĂNG ⚡", WIDTH/2, 110);

            currentChoices.forEach((choice, i) => {
                let bx = WIDTH/2 - 200, by = 180 + i * 85;
                let isHover = mouse.x >= bx && mouse.x <= bx + 400 && mouse.y >= by && mouse.y <= by + 65;
                
                ctx.fillStyle = isHover ? "rgb(60, 65, 92)" : "rgb(32, 32, 45)"; 
                ctx.fillRect(bx, by, 400, 65);
                ctx.strokeStyle = isHover ? "rgb(255, 210, 60)" : "rgb(85, 85, 110)"; 
                ctx.lineWidth = 2; ctx.strokeRect(bx, by, 400, 65);
                
                drawSuperPolishedIcon(bx + 12, by + 11, choice.id, isHover);

                ctx.fillStyle = "white"; ctx.font = "bold 18px Segoe UI"; ctx.textAlign = "left";
                ctx.fillText(choice.text, bx + 68, by + 38);
            });
        }

        if (gameState === "GAME_OVER") {
            ctx.fillStyle = "rgba(25, 5, 5, 0.9)"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = "rgb(255, 60, 60)"; ctx.font = "bold 52px Segoe UI"; ctx.textAlign = "center";
            ctx.fillText("THẤT BẠI", WIDTH/2, HEIGHT/2 - 70);

            ctx.fillStyle = "rgb(255, 60, 60)"; ctx.fillRect(WIDTH/2 - 110, HEIGHT/2 + 10, 220, 48);
            ctx.fillStyle = "white"; ctx.font = "bold 16px Segoe UI"; ctx.textAlign = "center";
            ctx.fillText("CHƠI LẠI", WIDTH/2, HEIGHT/2 + 40);

            ctx.fillStyle = "rgb(55, 55, 70)"; ctx.fillRect(WIDTH/2 - 110, HEIGHT/2 + 70, 220, 48);
            ctx.fillStyle = "white"; ctx.font = "bold 16px Segoe UI"; ctx.textAlign = "center";
            ctx.fillText("VỀ MENU CHÍNH", WIDTH/2, HEIGHT/2 + 100);
        }

        requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
</script>
